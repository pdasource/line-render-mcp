services:
  - type: web
    name: line-render-mcp
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: CHANNEL_ACCESS_TOKEN
        sync: false
      - key: LINE_CHANNEL_SECRET
        sync: false
      - key: MCP_API_KEY
        generateValue: true
      - key: DESTINATION_ID
        sync: false
